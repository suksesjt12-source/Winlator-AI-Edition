name: Upstream Winlator AI Build

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "integration/**"
      - "scripts/**"
      - ".github/workflows/upstream-winlator.yml"
      - "docs/UPSTREAM_INTEGRATION.md"

permissions:
  contents: read

jobs:
  build-upstream:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout AI Edition overlay
        uses: actions/checkout@v4

      - name: Checkout upstream Winlator with submodules
        uses: actions/checkout@v4
        with:
          repository: brunodev85/winlator
          ref: main
          path: upstream
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install required Android build tools
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $ANDROID_HOME/cmdline-tools" >&2
            exit 1
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-35" \
            "ndk;24.0.8215888" \
            "cmake;3.22.1"

      - name: Apply AI Assistant overlay
        run: python3 scripts/apply_upstream_ai_extension.py upstream

      - name: Build Winlator AI Edition
        working-directory: upstream/app
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload Winlator AI Edition APK
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-AI-Edition-upstream-debug
          path: upstream/app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
